<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafaf9" />
    <meta
      name="description"
      content="Максим Погуляев - Гипнотерапевт. Фокус: тревога в отношениях, созависимость, страхи."
    />
    <title>Максим Погуляев | Гипнотерапия</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <!-- GitHub Pages SPA Redirect for React Router -->
    <!-- When GitHub Pages serves 404.html for a missing path, the browser URL stays the requested path (e.g. /codependency). -->
    <!-- This script redirects to index.html?p=<path> so the main app can restore the URL and Router can handle the route. -->
    <script>
      (function() {
        const location = window.location;
        const pathname = location.pathname;

        // Exclude static files that should be served directly (robots.txt, sitemap.xml, etc.)
        const staticFiles = ['robots.txt', 'sitemap.xml', 'favicon.ico', 'site.webmanifest', 'yandex_597c89088d4e8e0f.html'];
        const isStaticFile = staticFiles.some(file => pathname.endsWith('/' + file) || pathname === '/' + file);

        if (isStaticFile) {
          return;
        }

        // When GitHub Pages serves 404 for a path like /codependency, we get 404.html content but URL stays /codependency.
        // So pathname is the requested path, not "404.html". Redirect to index.html with path in ?p= so the app can restore it.
        // Skip paths that look like static assets (have a file extension) to avoid breaking 404s for missing JS/CSS etc.
        var hasExtension = /\.[a-zA-Z0-9]+$/.test(pathname.split('?')[0]);
        if (pathname && pathname !== '/' && pathname !== '/index.html' && !hasExtension) {
          window.location.replace('/index.html?p=' + encodeURIComponent(pathname));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
