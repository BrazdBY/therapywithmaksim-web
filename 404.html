<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafaf9" />
    <meta
      name="description"
      content="Максим Погуляев - Гипнотерапевт. Фокус: тревога в отношениях, созависимость, страхи."
    />
    <title>Максим Погуляев | Гипнотерапия</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <!-- GitHub Pages SPA Redirect for React Router -->
    <!-- This script handles 404 errors on GitHub Pages by redirecting to index.html -->
    <!-- Works with root base path (/) for custom domain -->
    <script>
      (function() {
        const location = window.location;
        const pathname = location.pathname;

        // Only process if we're on 404.html
        if (!pathname.endsWith('404.html')) {
          // Check if we have a redirect parameter from a previous 404
          const params = new URLSearchParams(location.search);
          const redirectPath = params.get('p');
          if (redirectPath) {
            // Use root path for custom domain
            const newPath = '/' + redirectPath.replace(/^\//, '');
            window.history.replaceState(null, null, newPath + location.hash);
            return;
          }
          return;
        }

        // We're on 404.html - extract the original requested path
        // GitHub Pages serves 404.html for any non-existent path
        // For root base path, the requested path is the pathname minus '404.html'
        let requestedPath = pathname.replace(/\/404\.html$/, '');
        if (!requestedPath || requestedPath === '') {
          requestedPath = '/';
        }

        // Redirect to index.html with the path as a query parameter
        window.location.replace('/index.html?p=' + encodeURIComponent(requestedPath));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
